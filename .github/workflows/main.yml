name:
  petclinic-ci

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
env:
  ECR_REPOSITORY: gitops-ci

permissions:
  contents: read
  pull-requests: write

jobs:

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '21'
      - run: java --version

      - name: Run Tests on Branch
        run: mvn install

      - name: Upload Test Artifacts
        uses: actions/upload-artifact@v7
        with:
          name: petclinic
          path: target/*.jar

      - name: Slack Notification Success
        if: success()
        run: |
          curl -X POST -H 'Content-type: application/json' \
          --data '{"text":"✅ Build Success: '${{ github.repository }}' - '${{ github.run_number }}'"}' \
          ${{ vars.SLACK_WEBHOOK_URL }}


      - name: Slack Notification Failure
        if: failure()
        run: |
          curl -X POST -H 'Content-type: application/json' \
          --data '{"text":"❌ Build Failed: '${{ github.repository }}' - '${{ github.run_number }}'"}' \
          ${{ vars.SLACK_WEBHOOK_URL }}


  Testing:
    name: Testing
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '21'
      - run: java --version

      - name: Run Tests on Branch
        if: github.ref == 'refs/heads/main'
        run: mvn test

      - name: Run Checkstyles
        if: github.ref == 'refs/heads/main'
        run: mvn checkstyle:checkstyle

      - name: Slack Notification Success
        if: success()
        run: |
          curl -X POST -H 'Content-type: application/json' \
          --data '{"text":"✅ mvn Test Success: '${{ github.repository }}' - '${{ github.run_number }}'"}' \
          ${{ vars.SLACK_WEBHOOK_URL }}


      - name: Slack Notification Failure
        if: failure()
        run: |
          curl -X POST -H 'Content-type: application/json' \
          --data '{"text":"❌ mvn Test Failed: '${{ github.repository }}' - '${{ github.run_number }}'"}' \
          ${{ vars.SLACK_WEBHOOK_URL }}


  Security-Scan:
    name: Security Scan
    runs-on: ubuntu-latest
    needs: build 
    steps:
        - name: Checkout code
          uses: actions/checkout@v7
          with:
            fetch-depth: 0
  
        - name: Set up JDK 21
          uses: actions/setup-java@v6
          with:
            distribution: 'temurin'
            java-version: '21'
        - run: java --version
  
        - name: Generate Trivy Vulnerability Report
          uses: aquasecurity/trivy-action@v0.36.0
          with:
            scan-type: "fs"
            output: trivy-report.json
            format: json
            vuln-type: 'os,library'
            severity: 'CRITICAL,HIGH,MEDIUM'
            scan-ref: .
            exit-code: 0

        - name: Upload Vulnerability Scan Results
          uses: actions/upload-artifact@v4
          with:
            name: trivy-report
            path: trivy-report.json
            retention-days: 30
  
        - name: Slack Notification Success
          if: success()
          run: |
            curl -X POST -H 'Content-type: application/json' \
            --data '{"text":"✅ Trivvy Security Scan Success: '${{ github.repository }}' - '${{ github.run_number }}'"}' \
            ${{ vars.SLACK_WEBHOOK_URL }}


        - name: Slack Notification Failure
          if: failure()
          run: |
            curl -X POST -H 'Content-type: application/json' \
            --data '{"text":"❌ Trivvy Security Scan Failed: '${{ github.repository }}' - '${{ github.run_number }}'"}' \
            ${{ vars.SLACK_WEBHOOK_URL }}

  Build-Publish-ECR:
    name: BUILD AND PUBLISH TO ECR
    runs-on: ubuntu-latest
    needs: [build, Testing, Security-Scan]
    steps:
      - name: checkout code quality
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
      
      - name: Configure AWS login
        uses: aws-actions/configure-aws-credentials@v3
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ vars.AWS_REGION }}
          
      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v1

      - name: Build Docker image
        id: build-image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run:
          docker build -f Docker-files/app/multistage/Dockerfile -t .

      - name: run trivy scan on docker image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: image
          scan-ref: ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ github.sha }}
          ignore-unfixed: true
          format: json
          exit-code: 0
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH,MEDIUM'
          output: trivy-image-report.json

      - name: Upload Security Scan Report
        uses: actions/upload-artifact@v7
        with:
          name: trivy-image-scan-results
          path: trivy-image-report.json

      - name: Push Docker image to Amazon ECR
        id: upload-image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run:
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG


      - name: Slack Notification Success
          if: success()
          run: |
            curl -X POST -H 'Content-type: application/json' \
            --data '{"text":"✅ Build-Publish-ECR Success: '${{ github.repository }}' - '${{ github.run_number }}'"}' \
            ${{ vars.SLACK_WEBHOOK_URL }}

      - name: Slack Notification Failure
        if: failure()
        run: |
          curl -X POST -H 'Content-type: application/json' \
          --data '{"text":"❌ Build-Publish-ECR Failed: '${{ github.repository }}' - '${{ github.run_number }}'"}' \
          ${{ vars.SLACK_WEBHOOK_URL }}