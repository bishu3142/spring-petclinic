name:
  petclinic-ci

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
env:
  ECR_REPOSITORY: devops-ecr

permissions:
  contents: read
  pull-requests: write
  id-token: write

jobs:

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '21'
      - run: java --version

      - name: Run Tests on Branch
        run: mvn install

      - name: Upload Test Artifacts
        uses: actions/upload-artifact@v7
        with:
          name: petclinic
          path: target/*.jar

      - name: Slack Notification Success
        if: success()
        run: |
          curl -X POST -H 'Content-type: application/json' \
          --data '{"text":"✅ Build Success: '${{ github.repository }}' - '${{ github.run_number }}'"}' \
          ${{ vars.SLACK_WEBHOOK_URL }}


      - name: Slack Notification Failure
        if: failure()
        run: |
          curl -X POST -H 'Content-type: application/json' \
          --data '{"text":"❌ Build Failed: '${{ github.repository }}' - '${{ github.run_number }}'"}' \
          ${{ vars.SLACK_WEBHOOK_URL }}


  Testing:
    name: Testing
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '21'
      - run: java --version

      - name: Run Tests on Branch
        if: github.ref == 'refs/heads/main'
        run: mvn test

      - name: Run Checkstyles
        if: github.ref == 'refs/heads/main'
        run: mvn checkstyle:checkstyle

      - name: Slack Notification Success
        if: success()
        run: |
          curl -X POST -H 'Content-type: application/json' \
          --data '{"text":"✅ mvn Test Success: '${{ github.repository }}' - '${{ github.run_number }}'"}' \
          ${{ vars.SLACK_WEBHOOK_URL }}


      - name: Slack Notification Failure
        if: failure()
        run: |
          curl -X POST -H 'Content-type: application/json' \
          --data '{"text":"❌ mvn Test Failed: '${{ github.repository }}' - '${{ github.run_number }}'"}' \
          ${{ vars.SLACK_WEBHOOK_URL }}


  Security-Scan:
    name: Security Scan
    runs-on: ubuntu-latest
    needs: build 
    steps:
        - name: Checkout code
          uses: actions/checkout@v7
          with:
            fetch-depth: 0
  
        - name: Set up JDK 21
          uses: actions/setup-java@v6
          with:
            distribution: 'temurin'
            java-version: '21'
        - run: java --version
  
        - name: Generate Trivy Vulnerability Report
          uses: aquasecurity/trivy-action@v0.36.0
          with:
            scan-type: "fs"
            output: trivy-report.json
            format: json
            vuln-type: 'os,library'
            severity: 'CRITICAL,HIGH,MEDIUM'
            scan-ref: .
            exit-code: 0

        - name: Upload Vulnerability Scan Results
          uses: actions/upload-artifact@v4
          with:
            name: trivy-report
            path: trivy-report.json
            retention-days: 30
  
        - name: Slack Notification Success
          if: success()
          run: |
            curl -X POST -H 'Content-type: application/json' \
            --data '{"text":"✅ Trivvy Security Scan Success: '${{ github.repository }}' - '${{ github.run_number }}'"}' \
            ${{ vars.SLACK_WEBHOOK_URL }}


        - name: Slack Notification Failure
          if: failure()
          run: |
            curl -X POST -H 'Content-type: application/json' \
            --data '{"text":"❌ Trivvy Security Scan Failed: '${{ github.repository }}' - '${{ github.run_number }}'"}' \
            ${{ vars.SLACK_WEBHOOK_URL }}


  Deploy-VPC-Terraform:
    name: deploy VPC and ECS Terraform
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: manifests/vpc-terraform
    permissions:
      id-token: write
      contents: read
      security-events: write
      actions: read
    steps:
      - name: checkout code
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Configure AWS login
        uses: aws-actions/configure-aws-credentials@v3
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ vars.AWS_REGION }}
      
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform FMT
        run: terraform fmt -check -recursive

      - name: Terraform Init
        run: terraform init

      - name: Terraform Validate
        run: terraform validate

      - name: Run Checkov Scan
        id: checkov
        uses: bridgecrewio/checkov-action@master
        with:
          directory: manifests/vpc-terraform
          framework: terraform
          output_format: sarif
          output_file_path: results.sarif
          soft_fail: false

      - name: Upload Checkov Scan Results
        uses: actions/upload-artifact@v4
        with:
          name: Checkov-report
          path: results.sarif
          retention-days: 30

      - name: Upload Checkov Results
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: results.sarif

      - name: Run Trivy IaC Scan
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: config
          scan-ref: manifests/vpc-terraform
          format: sarif
          exit-code: 0
          severity: HIGH,CRITICAL
          output: trivy-vpc.sarif

      - name: Upload trivvy Scan Results
        uses: actions/upload-artifact@v4
        with:
          name: trivvy-vpc-report
          path: trivy-vpc.sarif
          retention-days: 30

      - name: Upload Trivy Results
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-vpc.sarif

      - name: Terraform Plan
        run: terraform plan -out=tfplan

      - name: Upload Plan
        uses: actions/upload-artifact@v4
        with:
          name: tfplan
          path: terraform/tfplan

      - name: Terraform Apply
        if: github.ref == 'refs/heads/main'
        run: terraform apply -auto-approve tfplan

      - name: Slack Notification Success
        if: success()
        run: |
          curl -X POST -H 'Content-type: application/json' \
          --data '{"text":"✅ Deploy-VPC-Terraform Success: '${{ github.repository }}' - '${{ github.run_number }}'"}' \
          ${{ vars.SLACK_WEBHOOK_URL }}


      - name: Slack Notification Failure
        if: failure()
        run: |
          curl -X POST -H 'Content-type: application/json' \
          --data '{"text":"❌ Deploy-VPC-Terraform Failed: '${{ github.repository }}' - '${{ github.run_number }}'"}' \
          ${{ vars.SLACK_WEBHOOK_URL }}

      
  Deploy-ECS-Terraform:
    name: deploy ECS Terraform
    runs-on: ubuntu-latest
    needs: [Deploy-VPC-Terraform]
    defaults:
      run:
        working-directory: manifests/ECR-ecs-terraform
    permissions:
      id-token: write
      contents: read
      security-events: write
      actions: read
    steps:
      - name: checkout code
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Configure AWS login
        uses: aws-actions/configure-aws-credentials@v3
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ vars.AWS_REGION }}
      
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform FMT
        run: terraform fmt -check -recursive

      - name: Terraform Init
        run: terraform init

      - name: Terraform Validate
        run: terraform validate

      - name: Run Checkov Scan
        id: checkov
        uses: bridgecrewio/checkov-action@master
        with:
          directory: manifests/ECR-ecs-terraform
          framework: terraform
          output_format: sarif
          output_file_path: results.sarif
          soft_fail: false

      - name: Upload Checkov Scan Results
        uses: actions/upload-artifact@v4
        with:
          name: Checkov-report
          path: results.sarif
          retention-days: 30

      - name: Upload Checkov Results
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: results.sarif

      - name: Run Trivy IaC Scan
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: config
          scan-ref: manifests/ECR-ecs-terraform
          format: sarif
          exit-code: 0
          severity: HIGH,CRITICAL
          output: trivy-ecs.sarif

      - name: Upload trivvy Scan Results
        uses: actions/upload-artifact@v4
        with:
          name: trivvy-ecs-report
          path: trivy-ecs.sarif
          retention-days: 30

      - name: Upload Trivy Results
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-ecs.sarif

      - name: Terraform Plan
        run: terraform plan -out=tfplan

      - name: Upload Plan
        uses: actions/upload-artifact@v4
        with:
          name: tfplan
          path: terraform/tfplan

      - name: Terraform Apply
        if: github.ref == 'refs/heads/main'
        run: terraform apply -auto-approve tfplan

      - name: Slack Notification Success
        if: success()
        run: |
          curl -X POST -H 'Content-type: application/json' \
          --data '{"text":"✅ Deploy-ECS-Terraform Success: '${{ github.repository }}' - '${{ github.run_number }}'"}' \
          ${{ vars.SLACK_WEBHOOK_URL }}


      - name: Slack Notification Failure
        if: failure()
        run: |
          curl -X POST -H 'Content-type: application/json' \
          --data '{"text":"❌ Deploy-ECS-Terraform Failed: '${{ github.repository }}' - '${{ github.run_number }}'"}' \
          ${{ vars.SLACK_WEBHOOK_URL }}


  Build-Publish-ECR:
    name: Build And Publish to ECS
    runs-on: ubuntu-latest
    needs: [build, Testing, Security-Scan, Deploy-VPC-Terraform,Deploy-ECS-Terraform]
    permissions:
      id-token: write
      contents: read
    steps:
      - name: checkout code
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
      
      - name: Configure AWS login
        uses: aws-actions/configure-aws-credentials@v3
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ vars.AWS_REGION }}
          
      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v1

      - name: Build Docker image
        id: build-image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run:
          docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG .

      - name: run trivy scan on docker image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: image
          scan-ref: ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ github.sha }}
          ignore-unfixed: true
          format: json
          exit-code: 0
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH,MEDIUM'
          output: trivy-image-report.json

      - name: Upload Security Scan Report
        uses: actions/upload-artifact@v7
        with:
          name: trivy-image-scan-results
          path: trivy-image-report.json

      - name: Push Docker image to Amazon ECR
        id: upload-image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
          echo "image=$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" >> $GITHUB_OUTPUT

      - name: Fill in the new image ID in the Amazon ECS task definition
        id: task-def
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: task-definition.json
          container-name: petclinic-con
          image: ${{ steps.upload-image.outputs.image }}

      - name: Deploy Amazon ECS task definition
        uses: aws-actions/amazon-ecs-deploy-task-definition@v2
        with:
          task-definition: ${{ steps.task-def.outputs.task-definition }}
          service: petclinic-service
          cluster: gitops-cluster
          wait-for-service-stability: true

      - name: Slack Notification Success
        if: success()
        run: |
          curl -X POST -H 'Content-type: application/json' \
          --data '{"text":"✅ Build-Publish-ECR Success: '${{ github.repository }}' - '${{ github.run_number }}'"}' \
          ${{ vars.SLACK_WEBHOOK_URL }}

      - name: Slack Notification Failure
        if: failure()
        run: |
          curl -X POST -H 'Content-type: application/json' \
          --data '{"text":"❌ Build-Publish-ECR Failed: '${{ github.repository }}' - '${{ github.run_number }}'"}' \
          ${{ vars.SLACK_WEBHOOK_URL }}