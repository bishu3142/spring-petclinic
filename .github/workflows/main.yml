name:
  petclinic-ci

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read
  pull-requests: write

jobs:

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '21'
      - run: java --version

      - name: Run Tests on Branch
        run: mvn install

      - name: Upload Test Artifacts
        uses: actions/upload-artifact@v7
        with:
          name: petclinic
          path: target/*.jar

      - name: Slack Notification Success
        if: success()
        run: |
          curl -X POST -H 'Content-type: application/json' \
          --data '{"text":"✅ Build Success: '${{ github.repository }}' - '${{ github.run_number }}'"}' \
          ${{ vars.SLACK_WEBHOOK_URL }}


      - name: Slack Notification Failure
        if: failure()
        run: |
          curl -X POST -H 'Content-type: application/json' \
          --data '{"text":"❌ Build Failed: '${{ github.repository }}' - '${{ github.run_number }}'"}' \
          ${{ vars.SLACK_WEBHOOK_URL }}


  Testing:
    name: Testing
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '21'
      - run: java --version

      - name: Run Tests on Branch
        if: github.ref == 'refs/heads/main'
        run: mvn test

      - name: Run Checkstyles
        if: github.ref == 'refs/heads/main'
        run: mvn checkstyle:checkstyle

      - name: Slack Notification Success
        if: success()
        run: |
          curl -X POST -H 'Content-type: application/json' \
          --data '{"text":"✅ Build Success: '${{ github.repository }}' - '${{ github.run_number }}'"}' \
          ${{ vars.SLACK_WEBHOOK_URL }}


      - name: Slack Notification Failure
        if: failure()
        run: |
          curl -X POST -H 'Content-type: application/json' \
          --data '{"text":"❌ Build Failed: '${{ github.repository }}' - '${{ github.run_number }}'"}' \
          ${{ vars.SLACK_WEBHOOK_URL }}


  Security-Scan:
    name: Security Scan
    runs-on: ubuntu-latest
    needs: build 
    steps:
        - name: Checkout code
          uses: actions/checkout@v7
          with:
            fetch-depth: 0
  
        - name: Set up JDK 21
          uses: actions/setup-java@v6
          with:
            distribution: 'temurin'
            java-version: '21'
        - run: java --version
  
        - name: Generate Trivy Vulnerability Report
          uses: aquasecurity/trivy-action@v0.36.0
          with:
            scan-type: "fs"
            output: trivy-report.json
            format: json
            vuln-type: 'os,library'
            severity: 'CRITICAL,HIGH,MEDIUM'
            scan-ref: .
            exit-code: 0

        - name: Upload Vulnerability Scan Results
          uses: actions/upload-artifact@v4
          with:
            name: trivy-report
            path: trivy-report.json
            retention-days: 30
  
        - name: Slack Notification Success
          if: success()
          run: |
            curl -X POST -H 'Content-type: application/json' \
            --data '{"text":"✅ Build Success: '${{ github.repository }}' - '${{ github.run_number }}'"}' \
            ${{ vars.SLACK_WEBHOOK_URL }}


        - name: Slack Notification Failure
          if: failure()
          run: |
            curl -X POST -H 'Content-type: application/json' \
            --data '{"text":"❌ Build Failed: '${{ github.repository }}' - '${{ github.run_number }}'"}' \
            ${{ vars.SLACK_WEBHOOK_URL }}